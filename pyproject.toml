[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-headers"
version = "0.10.0"
description = "Decode scientific file headers (cryo-EM, light microscopy and light-sheet imaging incl. TIFF/OME-TIFF, CZI, HDF5/Imaris/BigDataViewer, LIF, ND2, Zarr/N5; tabular, flow cytometry, mass spec, sequencing, structural biology) into typed fields. Pure, zero-dependency, with bounded readers that follow internal pointers without downloading the file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scigantic", email = "support@scigantic.com" }]
keywords = ["cryo-em", "mrc", "header", "schema-card", "instrument", "context", "edge", "light-sheet", "microscopy", "ome-tiff", "czi", "hdf5", "imaris", "bigdataviewer", "ome-zarr", "n5", "nd2", "lif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Zero runtime dependencies is a feature: installs and runs on an air-gapped box.
dependencies = []

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-headers"
Issues = "https://github.com/Scigantic/scigantic-headers/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scigantic-headers = "scigantic_headers.cli:main"
scigantic-headers-bench = "scigantic_headers.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_headers = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
